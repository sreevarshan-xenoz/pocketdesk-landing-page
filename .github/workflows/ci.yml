name: CI

# Pull requests only: a push to a branch with an open pull request would otherwise run it twice.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # End-to-end tests build the site, serve it, and drive it with the runner's Chrome.
      - run: npm run test:e2e
