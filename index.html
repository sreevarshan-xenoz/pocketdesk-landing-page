    <script>
      // Before first paint: the window's width as a plain number (CSS scales the
      // phone with it), and whether the scroll scenes run at all.
      ;(function () {
        var d = document.documentElement
        function size() {
          d.style.setProperty('--vwn', String(innerWidth))
        }
        size()
        addEventListener('resize', size)
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('motion')
      })()
    </script>
