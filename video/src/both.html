<template>
  <style>
    /* film.css */
    #root {
      position: absolute;
      inset: 0;
    }
  </style>
  <div id="root" data-composition-id="both" data-width="1920" data-height="1080" data-layout-allow-overflow data-layout-allow-overlap>
    <!--scene-->
  </div>
  <script>
    // 2. The phone turns upright beside a laptop: a text answered from the laptop, then a file across.
    const tl = gsap.timeline({ paused: true })
    const blurIn = { opacity: 1, filter: 'blur(0px)', duration: 0.35, ease: 'power3.out' }
    const blurOut = { opacity: 0, filter: 'blur(8px)', duration: 0.2, ease: 'power2.in' }
    const link = 196 // the link's length, from the laptop's edge to the phone's

    // The landscape phone starts as the last scene ended: build done, music in front, the pointer on it.
    tl.fromTo('#bl-sh-cmd', { '--chars': 21 }, { '--chars': 21, duration: 0.01 }, 0)
    tl.fromTo(['#bl-sh-out0', '#bl-sh-out1', '#bl-sh-out2'], { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0)
    tl.fromTo('#bl-music', { zIndex: 5 }, { zIndex: 5, duration: 0.01 }, 0)
    tl.fromTo('#bl-cursor', { x: 1060, y: 640 }, { x: 1060, y: 640, duration: 0.01 }, 0)
    tl.fromTo('#bl-music [class*="_eq_"] > i', { scaleY: 0.35, transformOrigin: '50% 100%' }, { scaleY: 0.35, duration: 0.01 }, 0)
    // It turns a quarter and lands as the upright phone.
    tl.fromTo('#both-landscape', { x: -68, y: 142, scale: 1, rotation: 0, opacity: 1 }, { x: 592, y: 80.5, scale: 0.35554, rotation: 90, duration: 0.95, ease: 'power3.inOut' }, 0)
    tl.to('#both-landscape', { opacity: 0, duration: 0.3, ease: 'power1.in' }, 0.62)
    tl.fromTo('#both-phone', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 0.6)
    tl.fromTo('#both-laptop', { x: -1320 }, { x: 0, duration: 1, ease: 'expo.out' }, 0.25)
    tl.fromTo('#both-shadow', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power1.out' }, 0.7)
    tl.fromTo(['#both-toast', '#both-files', '#both-n1', '#both-n2', '#both-sent', '#both-done'], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0)
    tl.set('#both-packet', { x: link, opacity: 0 }, 0)
    tl.fromTo('#both-typed', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 100% 0 0)', duration: 0.01 }, 0)

    tl.fromTo('#both-t1', { opacity: 0, filter: 'blur(10px)' }, blurIn, 1.1)

    // A text lands on the phone, crosses, and is answered from the laptop's toast.
    tl.fromTo('#both-n1', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, 1.4)
    tl.fromTo('#both-packet', { x: link, opacity: 1 }, { x: 0, opacity: 1, duration: 0.35, ease: 'power2.inOut', immediateRender: false }, 1.75)
    tl.to('#both-packet', { opacity: 0, duration: 0.05 }, 2.1)
    tl.fromTo('#both-toast', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' }, 2.1)
    // Punch in on the toast while the reply is typed (its text reads at about 28 px), then back out.
    const toast = { x: 974, y: 722 } // the toast's centre in the frame
    const k = 1.8
    tl.fromTo('#both-stage', { x: 0, y: 0, scale: 1, transformOrigin: '0 0' }, { x: toast.x * (1 - k) + (960 - toast.x), y: toast.y * (1 - k) + (560 - toast.y), scale: k, duration: 0.5, ease: 'power3.inOut' }, 2.15)
    tl.to('#both-typed', { clipPath: 'inset(0 0% 0 0)', duration: 0.95, ease: 'steps(29)' }, 2.6)
    tl.fromTo('#both-send', { scale: 1 }, { scale: 0.92, duration: 0.07, ease: 'power2.in' }, 3.6)
    tl.to('#both-send', { scale: 1, duration: 0.14, ease: 'power2.out' }, 3.67)
    tl.to('#both-stage', { x: 0, y: 0, scale: 1, duration: 0.55, ease: 'power3.inOut' }, 3.72)
    tl.fromTo('#both-packet', { x: 0, opacity: 1 }, { x: link, opacity: 1, duration: 0.35, ease: 'power2.inOut', immediateRender: false }, 4.05)
    tl.to('#both-packet', { opacity: 0, duration: 0.05 }, 4.4)
    tl.fromTo('#both-sent', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out', immediateRender: false }, 4.4)

    tl.to('#both-t1', blurOut, 4.45)
    tl.to('#both-toast', { opacity: 0, y: -16, duration: 0.25, ease: 'power2.in' }, 4.5)
    tl.to('#both-n1', { opacity: 0, y: -16, duration: 0.25, ease: 'power2.in' }, 4.5)
    tl.fromTo('#both-t2', { opacity: 0, filter: 'blur(10px)' }, blurIn, 4.7)

    // A file crosses: the progress on both screens is the same number.
    tl.fromTo('#both-files', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out', immediateRender: false }, 4.75)
    tl.fromTo('#both-n2', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out', immediateRender: false }, 4.85)
    const progress = { p: 0 }
    const pct = () => document.querySelectorAll('#both-pct, #both-ppct')
    tl.fromTo(
      progress,
      { p: 0 },
      {
        p: 100,
        duration: 1.6,
        ease: 'power1.inOut',
        onUpdate: () => {
          const v = Math.round(progress.p)
          pct().forEach((n) => (n.textContent = v + '%'))
          gsap.set(['#both-bar', '#both-pbar'], { scaleX: progress.p / 100 })
        },
      },
      4.95,
    )
    for (let k = 0; k < 6; k++) {
      tl.fromTo('#both-packet', { x: 0, opacity: 1 }, { x: link, opacity: 1, duration: 0.22, ease: 'none', immediateRender: false }, 5 + k * 0.26)
    }
    tl.to('#both-packet', { opacity: 0, duration: 0.05 }, 6.58)
    tl.fromTo('#both-done', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2)', immediateRender: false }, 6.65)

    // The whip to the map.
    tl.to('#both-t2', blurOut, 7.2)
    tl.to('#both-scene', { x: -1100, filter: 'blur(18px)', duration: 0.5, ease: 'power3.in' }, 7.45)
    tl.to({}, { duration: 0.01 }, 7.98)

    window.__timelines['both'] = tl
  </script>
</template>
