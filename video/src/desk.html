<template>
  <style>
    /* film.css */
    #root {
      position: absolute;
      inset: 0;
    }
  </style>
  <div id="root" data-composition-id="desk" data-width="1920" data-height="1080" data-layout-allow-overflow data-layout-allow-overlap>
    <!--scene-->
  </div>
  <script>
    // 1. The desktop finishes a build, shrinks into a phone, and a thumb drives it.
    const tl = gsap.timeline({ paused: true })
    const device = '#desk-device'
    const frame = '#desk-device [data-part=frame], #desk-device [data-part=keys], #desk-device [data-part=camera], #desk-device [data-side]'
    // The phone is laid out at 2056x956; these place its centre and scale it.
    const FULL = { x: -68, y: 62, scale: 1.2 } // its desktop fills the frame
    const WHOLE = { x: -68, y: 132, scale: 0.7 } // the whole phone, under the title
    const CLOSE = { x: -68, y: 142, scale: 1 } // pushed in on the screen: the desktop at (160, 170)
    const blurIn = { opacity: 1, filter: 'blur(0px)', duration: 0.35, ease: 'power3.out' }
    const blurOut = { opacity: 0, filter: 'blur(8px)', duration: 0.2, ease: 'power2.in' }

    tl.fromTo(device, FULL, { ...FULL, duration: 0.01 }, 0)
    tl.fromTo(frame, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0)
    tl.fromTo('#desk-cursor', { x: 1180, y: 300 }, { x: 560, y: 470, duration: 0.9, ease: 'power2.inOut' }, 0.15)

    // cargo build, typed and run
    tl.fromTo('#desk-sh-cmd', { '--chars': 0 }, { '--chars': 21, duration: 1, ease: 'steps(21)' }, 0.5)
    tl.fromTo('#desk-sh-out0', { opacity: 0 }, { opacity: 1, duration: 0.04 }, 1.75)
    tl.fromTo('#desk-sh-out1', { opacity: 0 }, { opacity: 1, duration: 0.04 }, 2.1)
    tl.fromTo('#desk-sh-out2', { opacity: 0 }, { opacity: 1, duration: 0.04 }, 2.75)

    tl.fromTo('#desk-t1', { opacity: 0, filter: 'blur(10px)' }, blurIn, 0.9)
    tl.to('#desk-t1', blurOut, 3.15)

    // the pull back: the desktop becomes a phone's screen
    tl.to(device, { ...WHOLE, duration: 2, ease: 'power3.inOut' }, 3.3)
    tl.to(frame, { opacity: 1, duration: 0.8, ease: 'power1.out' }, 3.9)
    tl.fromTo('#desk-shadow', { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'power1.out' }, 4.4)
    tl.fromTo('#desk-t2', { opacity: 0, filter: 'blur(10px)' }, blurIn, 4.9)
    tl.to('#desk-cursor', { x: 1050, y: 260, duration: 1.2, ease: 'power2.inOut' }, 5.6)
    tl.to('#desk-t2', blurOut, 7.25)

    // push in on the screen, and the thumb drives
    tl.to(device, { ...CLOSE, duration: 0.9, ease: 'power3.inOut' }, 7.35)
    tl.to('#desk-shadow', { opacity: 0, duration: 0.4, ease: 'power1.in' }, 7.35)
    tl.fromTo('#desk-t3', { opacity: 0, filter: 'blur(10px)' }, blurIn, 8.1)
    tl.fromTo('#desk-finger', { x: 1280, y: 510, opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, 8.6)
    tl.to('#desk-finger', { x: 1290, y: 890, duration: 1.1, ease: 'power2.inOut' }, 8.9)
    tl.to('#desk-cursor', { x: 1060, y: 640, duration: 1.1, ease: 'power2.inOut' }, 8.9)
    // the tap: the music player comes forward and plays
    tl.to('#desk-finger', { scale: 0.86, duration: 0.08, ease: 'power2.in' }, 10.1)
    tl.to('#desk-finger', { scale: 1, duration: 0.16, ease: 'power2.out' }, 10.18)
    tl.fromTo('#desk-ripple', { opacity: 1, scale: 0.2 }, { opacity: 0, scale: 1.5, duration: 0.6, ease: 'power2.out' }, 10.1)
    tl.fromTo('#desk-music', { zIndex: 1 }, { zIndex: 5, duration: 0.01 }, 10.12)
    tl.fromTo(
      '#desk-music [class*="_eq_"] > i',
      { scaleY: 0.35, transformOrigin: '50% 100%' },
      { scaleY: 1, duration: 0.26, ease: 'sine.inOut', stagger: { each: 0.06, repeat: 5, yoyo: true } },
      10.2,
    )
    tl.to('#desk-finger', { opacity: 0, duration: 0.25, ease: 'power1.in' }, 10.85)
    tl.to('#desk-t3', blurOut, 11.55)
    tl.to({}, { duration: 0.01 }, 11.98)

    window.__timelines['desk'] = tl
  </script>
</template>
