<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #060a17;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <!-- Pocketdesk, the film: 36 s, five scenes drawn from the site's own components (see SPEC.md). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="36" data-width="1920" data-height="1080">
      <div id="desk" data-composition-id="desk" data-composition-src="compositions/desk.html" data-start="0" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="both" data-composition-id="both" data-composition-src="compositions/both.html" data-start="12" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="anywhere" data-composition-id="anywhere" data-composition-src="compositions/anywhere.html" data-start="20" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="scripts" data-composition-id="scripts" data-composition-src="compositions/scripts.html" data-start="25.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="pocket" data-composition-id="pocket" data-composition-src="compositions/pocket.html" data-start="31" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Sound on what happens on screen; no music bed (see SPEC.md). -->
      <audio id="sfx-build-keys" class="clip" src="assets/sfx/typing.mp3" data-start="0.5" data-duration="1" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-pullback" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.3" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-tap" class="clip" src="assets/sfx/click-soft.mp3" data-start="10.08" data-track-index="12" data-volume="0.8"></audio>
      <audio id="sfx-turn" class="clip" src="assets/sfx/whoosh.mp3" data-start="12.05" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-text" class="clip" src="assets/sfx/notification.mp3" data-start="13.38" data-duration="1.4" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-reply-keys" class="clip" src="assets/sfx/typing.mp3" data-start="14.45" data-duration="0.95" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-send" class="clip" src="assets/sfx/click.mp3" data-start="15.43" data-track-index="12" data-volume="0.75"></audio>
      <audio id="sfx-checked" class="clip" src="assets/sfx/pop.mp3" data-start="18.63" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-whip" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="19.5" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-punch-a" class="clip" src="assets/sfx/click-soft.mp3" data-start="22.03" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-punch-b" class="clip" src="assets/sfx/click-soft.mp3" data-start="22.32" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-zoom" class="clip" src="assets/sfx/whoosh.mp3" data-start="24.85" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-ask-keys" class="clip" src="assets/sfx/typing.mp3" data-start="26" data-duration="1.3" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-ask" class="clip" src="assets/sfx/notification.mp3" data-start="27.93" data-duration="1.4" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-yes" class="clip" src="assets/sfx/click.mp3" data-start="28.8" data-track-index="12" data-volume="0.75"></audio>
      <audio id="sfx-carry" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="29.95" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-drop" class="clip" src="assets/sfx/whoosh.mp3" data-start="31.6" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="32.2" data-track-index="15" data-volume="0.7"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/pop.mp3" data-start="33.74" data-track-index="14" data-volume="0.55"></audio>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
